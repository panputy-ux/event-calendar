<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101115">
  <meta name="description" content="みんなで予定を確認できるイベントカレンダー">
  <title>イベントカレンダー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <div class="eyebrow">SHARED EVENT CALENDAR</div>
        <h1>イベントカレンダー</h1>
      </div>
      <span class="mode-label" aria-label="閲覧専用"><span class="mode-dot"></span>閲覧専用</span>
    </header>

    <main>
      <section class="calendar-card" aria-label="月間カレンダー">
        <div class="calendar-toolbar">
          <div>
            <div class="toolbar-heading">月間カレンダー</div>
            <h2 id="monthTitle" aria-live="polite"></h2>
          </div>
          <div class="month-actions">
            <button id="prevMonth" class="icon-button" type="button" aria-label="前月">‹</button>
            <button id="goToday" class="text-button" type="button">今日</button>
            <button id="nextMonth" class="icon-button" type="button" aria-label="翌月">›</button>
            <label class="month-picker-wrap" title="月を指定する"><span class="sr-only">年月を選択</span><input id="monthPicker" type="month" aria-label="年月を選択"></label>
          </div>
        </div>
        <div class="filter-line"><span class="filter-title">表示するイベント</span><div id="filters" class="filter-chips" aria-label="イベントの絞り込み"></div></div>
        <div class="calendar-weekdays" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
        <div id="calendarWeeks" class="calendar-weeks"></div>
        <p class="calendar-note">予定をタップすると詳細を表示します。期間の予定は横長の帯で表示します。</p>
      </section>

      <section class="month-list" aria-labelledby="listTitle">
        <div class="section-head"><div><span class="eyebrow">EVENTS</span><h2 id="listTitle">今月のイベント一覧</h2></div><span id="eventCount" class="count-pill">0 件</span></div>
        <p class="section-sub">親イベントを選択すると概要、日程を選択すると個別の詳細を確認できます。</p>
        <div id="monthList" class="group-list"></div>
      </section>
    </main>
    <footer class="site-footer"><span>イベント共有カレンダー</span><span id="dataNotice">サンプルデータで表示中</span></footer>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-scrim" data-close="true"></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div class="modal-top"><span id="modalTag" class="modal-tag">イベント詳細</span><button id="closeModal" class="modal-close" type="button" aria-label="閉じる">×</button></div>
      <h2 id="modalTitle"></h2>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="sample-events.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
